<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Notas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 400px;
        }

        td {
            border: 1px solid black; 
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: rgb(151, 151, 151);
            color: white;
            border: 1px solid black; 
            padding: 5px;
            text-align: center;
        }
        
        th#ex {
            background-color: white;
            color: black;
        }

        th.hum {
            background-color: white;
            color: black;
        }

        td.p1, td.p2 {
            background-color: rgb(151, 151, 151);
            color: white;
        }

        th.t1, th.t2 {
            text-align: left;
        }

        td.disp {
            text-align: left;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2">Área</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" id="ex">Exatas</th>
                <td class="disp">Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="disp">Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="disp">Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="disp">Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="4" class="t1">Média de Exatas</th>
                <td class="p1">0.0</td>
            </tr>
            <tr>
                <th rowspan="2" class="hum">Humanas</th>
                <td class="disp">História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="disp">Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th colspan="4" class="t2">Média de Humanas</th>
                <td class="p2">0.0</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
